<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Set Password | Beauty Collections</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f8f5f1;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .password-container {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
        }

        h2 {
            color: #6b5140;
            text-align: center;
            margin-bottom: 12px;
        }

        p {
            color: #777;
            text-align: center;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #554438;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #8a735f;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        button:hover {
            background: #6b5140;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 18px;
            font-size: 14px;
        }
    </style>

</head>

<body>

    <div class="password-container">

        <h2>BEAUTY COLLECTIONS</h2>

        <p>Create your password to access the admin dashboard.</p>

        <form id="passwordForm">

            <label for="newPassword">New Password</label>

            <input
                type="password"
                id="newPassword"
                placeholder="Enter your new password"
                minlength="8"
                required
            >

            <label for="confirmPassword">Confirm Password</label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm your password"
                minlength="8"
                required
            >

            <button type="submit" id="savePasswordBtn">
                SET PASSWORD
            </button>

            <p id="message"></p>

        </form>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>

        // SUPABASE CONNECTION

        const SUPABASE_URL = "https://cxcbdkthywspiknkvcgz.supabase.co";

        const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_tqQkW4ebZpKkGyNo1mQ5VA_td1YEyoM";

        const supabaseClient = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );

        const passwordForm = document.getElementById("passwordForm");
        const message = document.getElementById("message");
        const savePasswordBtn = document.getElementById("savePasswordBtn");

        // CHECK INVITATION SESSION

        async function checkInvitation() {

            const { data, error } = await supabaseClient.auth.getSession();

            if (error || !data.session) {

                // passwordForm.hidden = true;

                message.textContent =
                    "Your invitation session could not be verified. Please open the latest invitation email.";

                message.style.color = "red";

                return;
            }

        }

        checkInvitation();

        // SAVE NEW PASSWORD

        passwordForm.addEventListener("submit", async function (e) {

            e.preventDefault();

            const newPassword =
                document.getElementById("newPassword").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;

            if (newPassword.length < 8) {

                message.textContent =
                    "Your password must contain at least 8 characters.";

                message.style.color = "red";

                return;
            }

            if (newPassword !== confirmPassword) {

                message.textContent = "Passwords do not match.";

                message.style.color = "red";

                return;
            }

            savePasswordBtn.disabled = true;
            savePasswordBtn.textContent = "SAVING...";

            const { error } = await supabaseClient.auth.updateUser({
                password: newPassword
            });

            if (error) {

                message.textContent = error.message;

                message.style.color = "red";

                savePasswordBtn.disabled = false;
                savePasswordBtn.textContent = "SET PASSWORD";

                return;
            }

            message.textContent =
                "Password created successfully! Redirecting...";

            message.style.color = "green";

            setTimeout(() => {

                window.location.href = "admin.html";

            }, 2000);

        });

    </script>

</body>
</html>
